<!DOCTYPE html>
<html>

<head>
    <title>FRUNIRA</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
        }

        .header {
            height: 150px;
            background-color:#4A0E1E;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 30px;
        }

        .logo{
            width: 80px;
            height: 80px;
            border-radius: 60%;
            margin-right: 25px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            color: #F5D58A;
        }

        p {
            font-size: 18xpx;
            color: #F3E4C1;
        }

        /* SEARCH */

        .search {
            margin-left: auto;
            display: flex;
            align-items: center;
        }

        .search input {
            width: 300px;
            height: 42px;
            border: none;
            border-radius: 25px;
            padding: 0 18px;
            font-size: 14px;
        }

        .search button {
            margin-left: -45px;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: #F0662C;
            font-size: 20px;
            cursor: pointer;
        }

        /* LOGIN & CART */

        .login,
        .cart {
            margin-left: 35px;
            font-size: 17px;
         
        }

    </style>

</head>

<body>

    <!-- ================= HEADER ================= -->

    <div class="header">

        <img src="logo.jpeg"
             class="logo">

        <div>
            <h1>FRUNIRA</h1>
            <p>Fresh Fruit • Healthy Life  • Happy You</p>
        </div>

        <div class="search">
            <input type="text" placeholder="Search for products.">
            <button>🔍</button>
        </div>

        <div class="login">
            👤 Login
        </div>

        <div class="cart">
            🛒 Cart
        </div>

    </div>

</body>

</html>
